name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Build node release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" -o dist/sourcenode_linux_amd64 ./cmd/sourcenode
          cd dist
          sha256sum sourcenode_linux_amd64 > sourcenode_linux_amd64.sha256
          cp sourcenode_linux_amd64.sha256 checksums.txt
      - name: Attach node and egg
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/sourcenode_linux_amd64 dist/sourcenode_linux_amd64.sha256 dist/checksums.txt pterodactyl/source-egg.json --clobber
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=beta
            type=raw,value=stable,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: VERSION=${{ github.event.release.tag_name }}
