name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: CGO_ENABLED=0 go build ./cmd/...
      - run: bash -n scripts/install-node.sh
      - run: bash scripts/test-install-node.sh
      - run: bash scripts/test-seed-steamcmd.sh
      - run: docker build -t source-egg:ci .
      - run: docker run --rm source-egg:ci profiles
      - run: bash scripts/smoke-container.sh source-egg:ci
